version: '3.8'

services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudweave-node1
    environment:
      - CLOUDWEAVE_PORT=9000
      - CLOUDWEAVE_DATA=/data
      - CLOUDWEAVE_PEERS=http://node2:9000,http://node3:9000,http://node4:9000,http://node5:9000
      - CLOUDWEAVE_API_KEYS=${CLOUDWEAVE_API_KEYS:-}
    mem_limit: 256m
    ports:
      - "9000:9000"
    volumes:
      - node1_data:/data

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudweave-node2
    environment:
      - CLOUDWEAVE_PORT=9000
      - CLOUDWEAVE_DATA=/data
      - CLOUDWEAVE_PEERS=http://node1:9000,http://node3:9000,http://node4:9000,http://node5:9000
      - CLOUDWEAVE_API_KEYS=${CLOUDWEAVE_API_KEYS:-}
    mem_limit: 256m
    ports:
      - "9001:9000"
    volumes:
      - node2_data:/data

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudweave-node3
    environment:
      - CLOUDWEAVE_PORT=9000
      - CLOUDWEAVE_DATA=/data
      - CLOUDWEAVE_PEERS=http://node1:9000,http://node2:9000,http://node4:9000,http://node5:9000
      - CLOUDWEAVE_API_KEYS=${CLOUDWEAVE_API_KEYS:-}
    mem_limit: 256m
    ports:
      - "9002:9000"
    volumes:
      - node3_data:/data

  node4:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudweave-node4
    environment:
      - CLOUDWEAVE_PORT=9000
      - CLOUDWEAVE_DATA=/data
      - CLOUDWEAVE_PEERS=http://node1:9000,http://node2:9000,http://node3:9000,http://node5:9000
      - CLOUDWEAVE_API_KEYS=${CLOUDWEAVE_API_KEYS:-}
    mem_limit: 256m
    ports:
      - "9003:9000"
    volumes:
      - node4_data:/data

  node5:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudweave-node5
    environment:
      - CLOUDWEAVE_PORT=9000
      - CLOUDWEAVE_DATA=/data
      - CLOUDWEAVE_PEERS=http://node1:9000,http://node2:9000,http://node3:9000,http://node4:9000
      - CLOUDWEAVE_API_KEYS=${CLOUDWEAVE_API_KEYS:-}
    mem_limit: 256m
    ports:
      - "9004:9000"
    volumes:
      - node5_data:/data

volumes:
  node1_data:
  node2_data:
  node3_data:
  node4_data:
  node5_data:
